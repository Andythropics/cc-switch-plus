name: Release

on:
  push:
    tags: ["v*-plus.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node scripts/check-publication.mjs
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.REF_TYPE !== "tag" || process.env.RELEASE_TAG !== "v" + version) {
              throw new Error("Run release on the version tag matching package.json");
            }
          '
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Build preview packages
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --target "$BUILD_TARGET" --bundles app,dmg
      - name: Collect packages
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$BUILD_TARGET/release/bundle"
          stem="CC-Switch-Plus-$RELEASE_TAG-macOS-$BUILD_ARCH"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/CC Switch Plus.app" "release-assets/$stem.zip"
          dmg=("$bundle"/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          cp "${dmg[0]}" "release-assets/$stem.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare draft prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- *.dmg *.zip > SHA256SUMS
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw new Error("Refusing to replace published release assets")'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease \
              --title "CC Switch Plus $RELEASE_TAG" --notes-file docs/releases/initial-preview.md
          fi
